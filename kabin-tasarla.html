  <meta name="keywords" content="asansör kabini tasarla, asansör kabin tasarım, online kabin tasarımı, 3d asansör kabini, salon tasarımı, dekoratif panel seçimi, duvar paneli tasarım">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{--ink:#0B0B0C;--ink-2:#131316;--ink-3:#1B1B20;--paper:#F5F4F0;--gold:#D2B639;
        --steel:#9A9AA2;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.06);
        --gold-grad:linear-gradient(135deg,#F5DE6C,#D2B639 48%,#B28D09)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;overflow:hidden;height:100vh}
  a{color:inherit;text-decoration:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;height:60px;
       border-bottom:1px solid var(--line);background:rgba(11,11,12,.9);position:relative;z-index:20}
  .top .l{display:flex;align-items:center;gap:14px}
  .top img.lg{height:30px}
  .top .tt{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:400;margin:0}
  .tb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:8px 14px;border-radius:2px;
      font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--paper);font-family:inherit;transition:.2s;white-space:nowrap}
  .tb:hover{border-color:var(--gold);color:var(--gold)}
  .tb.on{border-color:var(--gold);color:var(--gold)}
  .tb.g{background:var(--gold-grad);color:#1A1400;border-color:transparent}
  .tb.g:hover{filter:brightness(1.08)}
  .wrap{display:flex;height:calc(100vh - 60px)}
  #stage{flex:1;position:relative;background:#000;min-width:0}
  #sahne{position:absolute;inset:0}
  #sahne canvas{display:block;width:100%;height:100%}
  .badge{position:absolute;left:14px;top:14px;font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);
         background:rgba(0,0,0,.5);border:1px solid var(--line);padding:6px 11px;border-radius:2px;z-index:5;max-width:60%}
  .stageAlt{position:absolute;left:14px;bottom:14px;display:flex;gap:7px;z-index:5;flex-wrap:wrap}
  .tb.zoom{width:40px;height:38px;justify-content:center;padding:0;font-size:17px;line-height:1;background:rgba(0,0,0,.45)}
  .rec{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.66);
       flex-direction:column;gap:14px;z-index:9;text-align:center;padding:20px}
  .rec.on{display:flex}
  .rec .bar{width:220px;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
  .rec .bar i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .1s}
  .rec p{font-size:13.5px;max-width:34ch;line-height:1.5}
  .side{width:360px;min-width:360px;border-left:1px solid var(--line);background:var(--ink-2);display:flex;flex-direction:column;overflow:hidden}
  .surf{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
  .surf button{flex:1;min-width:84px;padding:13px 6px;background:none;border:none;border-right:1px solid var(--line-2);color:var(--steel);
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
  .surf button:last-child{border-right:none}
  .surf button.on{color:var(--gold);background:var(--ink-3);box-shadow:inset 0 -2px 0 var(--gold)}
  .ipucu{padding:11px 14px 9px;font-size:12px;color:var(--steel);line-height:1.5;border-bottom:1px solid var(--line-2)}
  .ipucu b{color:var(--paper);font-weight:600}
  .grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .sw{border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;background:var(--ink-3);transition:.18s;padding:0}
  .sw:hover{transform:translateY(-3px);border-color:rgba(210,182,57,.6)}
  .sw.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .sw img{width:100%;aspect-ratio:1/1.6;object-fit:cover;display:block}
  .sw .c{padding:7px 8px;font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);text-align:center}
  .sum{border-top:1px solid var(--line);padding:13px 14px;background:var(--ink-3)}
  .sum .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
  .sum .row span:first-child{color:var(--steel)}
  .sum .row span:last-child{font-family:'Space Mono',monospace;text-align:right}
  .sum .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
  .sum .btns .tb{justify-content:center}
  .sum .btns .wide{grid-column:1/-1}
  .yok{padding:30px 16px;color:var(--steel);font-size:13px;line-height:1.6;text-align:center}
  @media(max-width:900px){
    .wrap{flex-direction:column}
    #stage{height:46vh;flex:none}
    .side{width:100%;min-width:0;border-left:none;border-top:1px solid var(--line);flex:1}
    .grid{grid-template-columns:repeat(4,1fr)}
    .top .tt{display:none}
  }
  @media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div class="l"><img class="lg" src="gorsel/logo.png" alt="Sarıtepe"><h1 class="tt">Asansör Kabini ve Salon Tasarla</h1></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="tb on" id="sahneAsansor">Asansör</button>
    <button class="tb" id="sahneSalon">Salon</button>
    <button class="tb" id="sifirla">Sıfırla</button>
    <a class="tb" href="index.html">← Siteye Dön</a>
  </div>
</div>

<div class="wrap">
  <div id="stage">
    <div id="sahne"></div>
    <div class="badge" id="badge">Yükleniyor…</div>
    <div class="stageAlt">
      <button class="tb" id="gez">İçinde gez</button>
      <button class="tb zoom" id="yakin" aria-label="Yaklaş">+</button>
      <button class="tb zoom" id="uzak" aria-label="Uzaklaş">−</button>
    </div>
    <div class="rec" id="rec"><p id="recTxt">Video hazırlanıyor…</p><div class="bar"><i id="recBar"></i></div></div>
  </div>

  <div class="side">
    <div class="surf" id="surf"></div>
    <div class="ipucu" id="ipucu">Bir yüzey seçin, sonra alttan panel seçin.</div>
    <div class="grid" id="grid"></div>
    <div class="sum">
      <div id="ozet"></div>
      <div class="btns">
        <button class="tb" id="shot">Görseli İndir</button>
        <button class="tb" id="vid">Video Oluştur</button>
        <a class="tb g wide" id="wa" target="_blank" rel="noopener">WhatsApp ile Teklif Al</a>
      </div>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/tasarla.js"></script>
<script>
(function(){
  "use strict";

  // Panel listesi: kod ve tip. Olculer tasarla.js icinde plaka hesabinda
  // kullaniliyor; buradaki tek is hangi panelin duvara hangisinin zemine
  // gidecegini bilmek.
  var PANELLER = [{"code":"SS-101","type":"wall","size_mm":[1220,2440]},{"code":"SS-102","type":"wall","size_mm":[1220,2440]},{"code":"SS-103","type":"wall","size_mm":[1220,2440]},{"code":"SS-301","type":"wall","size_mm":[1220,2440]},{"code":"SS-302","type":"wall","size_mm":[1220,2440]},{"code":"SS-303","type":"wall","size_mm":[1220,2440]},{"code":"SS-401","type":"wall","size_mm":[1220,2440]},{"code":"SS-402","type":"wall","size_mm":[1220,2440]},{"code":"SS-403","type":"wall","size_mm":[1220,2440]},{"code":"SS-501","type":"wall","size_mm":[1220,2440]},{"code":"SS-502","type":"wall","size_mm":[1220,2440]},{"code":"SS-503","type":"wall","size_mm":[1220,2440]},{"code":"SS-601","type":"wall","size_mm":[1220,2440]},{"code":"SS-602","type":"wall","size_mm":[1220,2440]},{"code":"SS-603","type":"wall","size_mm":[1220,2440]},{"code":"SS-701","type":"wall","size_mm":[1220,2440]},{"code":"SS-702","type":"wall","size_mm":[1220,2440]},{"code":"SS-703","type":"wall","size_mm":[1220,2440]},{"code":"SS-201","type":"wall","size_mm":[1220,2440]},{"code":"SS-202","type":"wall","size_mm":[1220,2440]},{"code":"SS-203","type":"wall","size_mm":[1220,2440]},{"code":"SS-801","type":"wall","size_mm":[1220,2440]},{"code":"SS-802","type":"wall","size_mm":[1220,2440]},{"code":"SS-803","type":"wall","size_mm":[1220,2440]},{"code":"SS-901","type":"wall","size_mm":[1220,2440]},{"code":"SS-902","type":"wall","size_mm":[1220,2440]},{"code":"SS-903","type":"wall","size_mm":[1220,2440]},{"code":"SS-904","type":"wall","size_mm":[1220,2440]},{"code":"SS-1001","type":"floor","size_mm":[1220,1520]},{"code":"SS-1002","type":"floor","size_mm":[1220,1520]},{"code":"SS-1003","type":"floor","size_mm":[1220,1520]}];

  var sahneKutu = document.getElementById('sahne');
  var badge = document.getElementById('badge');
  var surf = document.getElementById('surf');
  var grid = document.getElementById('grid');
  var ozet = document.getElementById('ozet');
  var ipucu = document.getElementById('ipucu');
  var sonDurum = null;

  if (!window.Tasarla || !window.Tasarla.destekli()) {
    document.getElementById('stage').innerHTML =
      '<div class="yok">Bu cihaz üç boyutlu görüntülemeyi desteklemiyor.<br>' +
      'Panellerin tamamını <a href="urunler.html" style="color:var(--gold)">Ürünlerimiz</a> sayfasından inceleyebilirsiniz.</div>';
    return;
  }

  function panelBul(kod){ for (var i=0;i<PANELLER.length;i++) if (PANELLER[i].code===kod) return PANELLER[i]; return null; }

  /* ---- Yuzey dugmeleri ---- */
  function yuzeyleriCiz(d){
    surf.innerHTML = '';
    d.yuzeyler.forEach(function(s){
      var b = document.createElement('button');
      b.textContent = s.ad;
      if (s.anahtar === d.secili) b.className = 'on';
      b.onclick = function(){ window.Tasarla.sec(s.anahtar); };
      surf.appendChild(b);
    });
  }

  /* ---- Secili yuzeye UYGUN paneller ---- */
  function panelleriCiz(d){
    var s = null;
    d.yuzeyler.forEach(function(x){ if (x.anahtar === d.secili) s = x; });
    grid.innerHTML = '';
    if (!s) return;

    ipucu.innerHTML = s.zemin
      ? '<b>' + s.ad + '</b> seçili. Aşağıda yalnız <b>yer panelleri</b> var — duvar paneli zemine uygulanmaz.'
      : '<b>' + s.ad + '</b> seçili. Aşağıda yalnız <b>duvar panelleri</b> var — yer paneli duvara uygulanmaz.';

    PANELLER.filter(function(p){ return s.zemin ? p.type === 'floor' : p.type !== 'floor'; })
      .forEach(function(p){
        var b = document.createElement('button');
        b.className = 'sw' + (s.kod === p.code ? ' on' : '');
        b.type = 'button';
        b.innerHTML = '<img src="urun/kucuk/' + p.code + '.jpg" alt="' + p.code + '" loading="lazy">' +
                      '<div class="c">' + p.code + '</div>';
        b.onclick = function(){
          var r = window.Tasarla.uygula(p.code);
          badge.textContent = r.mesaj;
        };
        grid.appendChild(b);
      });
  }

  /* ---- Ozet: hangi yuzeyde ne var, kac plaka ---- */
  function ozetCiz(d){
    ozet.innerHTML = '';
    var toplam = 0;
    d.yuzeyler.forEach(function(s){
      var r = document.createElement('div'); r.className = 'row';
      var a = document.createElement('span'); a.textContent = s.ad;
      var b = document.createElement('span');
      b.textContent = s.kod ? s.kod + '  ·  ' + s.plaka + ' plaka' : 'seçilmedi';
      toplam += s.plaka || 0;
      r.append(a, b); ozet.appendChild(r);
    });
    if (toplam) {
      var t = document.createElement('div'); t.className = 'row';
      t.style.cssText = 'border-top:1px solid var(--line);margin-top:6px;padding-top:7px';
      var ta = document.createElement('span'); ta.textContent = 'Toplam (fire dahil)';
      var tb = document.createElement('span'); tb.textContent = toplam + ' plaka';
      tb.style.color = 'var(--gold)';
      t.append(ta, tb); ozet.appendChild(t);
    }
    waGuncelle(d, toplam);
  }

  function waGuncelle(d, toplam){
    var satir = d.yuzeyler.filter(function(s){ return s.kod; })
      .map(function(s){ return s.ad + ': ' + s.kod + ' (' + s.plaka + ' plaka)'; }).join(', ');
    var mekan = d.sahne === 'salon' ? 'salon' : 'asansör kabini';
    var metin = satir
      ? 'Merhaba, sitenizden bir ' + mekan + ' tasarladım. ' + satir + '. Toplam ' + toplam + ' plaka. Teklif alabilir miyim?'
      : 'Merhaba, Sarıtepe panelleri hakkında bilgi almak istiyorum.';
    document.getElementById('wa').href = 'https://wa.me/905324615118?text=' + encodeURIComponent(metin);
  }

  var gezAcik = false;
  function gezDugmesiniEsle(acik){
    gezAcik = acik;
    var b = document.getElementById('gez');
    b.classList.toggle('on', acik);
    b.textContent = acik ? 'Dışarıdan bak' : 'İçinde gez';
  }
  function degisti(d){
    sonDurum = d;
    yuzeyleriCiz(d); panelleriCiz(d); ozetCiz(d);
    gezDugmesiniEsle(d.yurume);
  }

  window.Tasarla.baslat(sahneKutu, PANELLER, { degisti: degisti });
  badge.textContent = 'Boş başlıyor — yüzeye dokunun, sonra panel seçin';

  /* ---- Sahne degistirme ---- */
  function sahneSec(ad){
    window.Tasarla.sahne(ad);
    document.getElementById('sahneAsansor').classList.toggle('on', ad !== 'salon');
    document.getElementById('sahneSalon').classList.toggle('on', ad === 'salon');
    badge.textContent = ad === 'salon' ? 'Salon' : 'Asansör kabini';
  }
  document.getElementById('sahneAsansor').onclick = function(){ sahneSec('asansor'); };
  document.getElementById('sahneSalon').onclick = function(){ sahneSec('salon'); };
  document.getElementById('sifirla').onclick = function(){ window.Tasarla.temizle(); badge.textContent = 'Sıfırlandı'; };

  document.getElementById('gez').onclick = function(){
    window.Tasarla.yurumeAc(!gezAcik);
    badge.textContent = gezAcik
      ? 'Yön tuşlarıyla yürüyün, sürükleyerek bakın'
      : 'Sürükleyin, tekerlekle yaklaşın';
  };

  /* ---- Gorsel ve video: WebGL tuvalinden ---- */
  function tuval(){ return sahneKutu.querySelector('canvas'); }
  function indir(url, ad){
    var a = document.createElement('a'); a.href = url; a.download = ad;
    document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 100);
  }

  document.getElementById('shot').onclick = function(){
    var c = tuval(); if (!c) return;
    try { indir(c.toDataURL('image/png'), 'saritepe-tasarim.png'); }
    catch (e) { alert('Görsel indirilemedi: ' + e.message); }
  };

  document.getElementById('vid').onclick = function(){
    var c = tuval(); if (!c) return;
    var rec = document.getElementById('rec'), bar = document.getElementById('recBar'), txt = document.getElementById('recTxt');
    function bitir(m){ txt.textContent = m; setTimeout(function(){ rec.classList.remove('on'); }, 2200); }
    if (!c.captureStream || typeof MediaRecorder === 'undefined') {
      rec.classList.add('on');
      return bitir('Tarayıcınız video kaydını desteklemiyor. "Görseli İndir" ile fotoğrafı kaydedebilirsiniz.');
    }
    rec.classList.add('on'); txt.textContent = 'Video çekiliyor…'; bar.style.width = '0';

    var adaylar = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'];
    var tur = adaylar.filter(function(t){ return MediaRecorder.isTypeSupported(t); })[0];
    if (!tur) return bitir('Video biçimi desteklenmiyor.');

    var akis = c.captureStream(30);
    var kayit = new MediaRecorder(akis, { mimeType: tur, videoBitsPerSecond: 6000000 });
    var parcalar = [];
    kayit.ondataavailable = function(e){ if (e.data && e.data.size) parcalar.push(e.data); };
    kayit.onstop = function(){
      var blob = new Blob(parcalar, { type: tur });
      indir(URL.createObjectURL(blob), 'saritepe-tasarim.' + (tur.indexOf('mp4') >= 0 ? 'mp4' : 'webm'));
      bitir('Video indirildi.');
    };
    var sure = 8000;
    kayit.start();
    window.Tasarla.tur(sure);   // kayit boyunca sahne bir tam tur donsun

    // Sekiz saniyelik tur: sahne kendi etrafinda yavasca doner.
    var t0 = performance.now();
    (function don(){
      var k = (performance.now() - t0) / sure;
      bar.style.width = Math.min(100, k * 100) + '%';
      if (k >= 1) { kayit.stop(); return; }
      requestAnimationFrame(don);
    })();
  };

  document.getElementById('yakin').onclick = function(){ window.Tasarla.yakinlastir(-1); };
  document.getElementById('uzak').onclick  = function(){ window.Tasarla.yakinlastir(1); };

  window.addEventListener('resize', function(){ window.Tasarla.boyutlandir(); });
})();
</script>
</body>
</html>
